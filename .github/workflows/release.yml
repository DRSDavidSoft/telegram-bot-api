name: Build, test, and release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  setup-release-info:
    name: Setup Release Info
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      release-tag-name: ${{ steps.tag.outputs.tag-name }}
      release-title: ${{ steps.title.outputs.title }}
      is-prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: version
        run: echo "version=$(grep -oP 'project\(TelegramBotApi VERSION \K[\d.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Determine Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag-name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag-name=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Release Title
        id: title
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "title=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "title=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Prerelease
        id: prerelease
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build and test Linux x86_64 (GCC)
            os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            release_artifact_name: telegram-bot-api-x86_64
            release_artifact_path: build/telegram-bot-api-linux-x86_64
          - name: Build and test Linux x86_64 (Clang)
            os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
            release_artifact_name: ''
            release_artifact_path: ''
          - name: Build and test Windows x64
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            release_artifact_name: telegram-bot-api-windows-x64
            release_artifact_path: build/telegram-bot-api-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gperf

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          $vcpkgRoot = (Resolve-Path .\vcpkg).Path
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          .\vcpkg\vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows
          "$vcpkgRoot\installed\x64-windows\tools\gperf" >> $env:GITHUB_PATH

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -S ${{ github.workspace }}

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build `
            -A x64 `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake `
            -DGPERF_EXECUTABLE:FILEPATH=${{ env.VCPKG_ROOT }}/installed/x64-windows/tools/gperf/gperf.exe `
            -DCMAKE_INSTALL_PREFIX:PATH=${{ github.workspace }}/install `
            -S ${{ github.workspace }}

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --target telegram-bot-api

      - name: Build Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --target telegram-bot-api -- /m

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package Linux x86_64 release artifact
        if: runner.os == 'Linux' && matrix.release_artifact_name == 'telegram-bot-api-x86_64' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        run: cp build/telegram-bot-api build/telegram-bot-api-linux-x86_64

      - name: Package Windows x64 release artifact
        if: runner.os == 'Windows' && matrix.release_artifact_name == 'telegram-bot-api-windows-x64' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix install
          Compress-Archive -Path install/bin/* -DestinationPath build/telegram-bot-api-windows-x64.zip

      - name: Upload release artifact
        if: matrix.release_artifact_name != '' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_artifact_name }}
          path: ${{ matrix.release_artifact_path }}

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compilation dependencies (x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git \
            gperf \
            libssl-dev \
            zlib1g-dev

      - name: Create build directories
        run: |
          mkdir -p build
          mkdir -p build-native

      - name: Prepare for cross-compilation
        run: |
          cd build-native
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --target prepare_cross_compiling

      - name: Add ARM64 architecture
        run: sudo dpkg --add-architecture arm64

      - name: Configure ARM64 package sources
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          sources_dir = Path("/etc/apt/sources.list.d")

          def rewrite_list_file(path: Path) -> None:
            if not path.exists():
              return
            lines = []
            for line in path.read_text().splitlines():
              stripped = line.lstrip()
              if stripped.startswith("deb ["):
                if "arch=" in line:
                  line = re.sub(r"arch=[^ ]+", "arch=amd64", line, count=1)
                else:
                  line = line.replace("[", "[arch=amd64 ", 1)
              elif stripped.startswith("deb "):
                line = line.replace("deb ", "deb [arch=amd64] ", 1)
              lines.append(line)
            path.write_text("\n".join(lines) + "\n")

          for path in sources_dir.glob("*.sources"):
            text = path.read_text()
            blocks = []
            for block in text.strip().split("\n\n"):
              lines = [line for line in block.splitlines() if not line.startswith("Architectures:")]
              if any(line.startswith("Types:") for line in lines):
                lines.append("Architectures: amd64")
              blocks.append("\n".join(lines))
            path.write_text("\n\n".join(blocks) + "\n")

          rewrite_list_file(Path("/etc/apt/sources.list"))
          for path in sources_dir.glob("*.list"):
            rewrite_list_file(path)
          PY
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: jammy jammy-updates jammy-security jammy-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install ARM64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev:arm64 \
            zlib1g-dev:arm64

      - name: Build ARM64 binary
        run: |
          cd build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_CROSSCOMPILING=True \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_PREFIX_PATH=/usr/lib/aarch64-linux-gnu \
            ..
          cmake --build . --target telegram-bot-api

      - name: Package ARM64 release artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: mv build/telegram-bot-api build/telegram-bot-api-linux-arm64

      - name: Upload ARM64 release artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-bot-api-arm64
          path: build/telegram-bot-api-linux-arm64

  create-release:
    name: Create Release
    needs: [setup-release-info, build-native, build-linux-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.setup-release-info.outputs.release-title }}
          tag_name: ${{ needs.setup-release-info.outputs.release-tag-name }}
          prerelease: ${{ needs.setup-release-info.outputs.is-prerelease }}
          files: |
            telegram-bot-api-x86_64/telegram-bot-api-linux-x86_64
            telegram-bot-api-arm64/telegram-bot-api-linux-arm64
            telegram-bot-api-windows-x64/telegram-bot-api-windows-x64.zip
          generate_release_notes: true
